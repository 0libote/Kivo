version: 2
updates:
  # Keep pinned GitHub Actions SHAs fresh (CodeQL, audits, builds).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Frontend dependencies (bun lockfile) — DISABLED for now. Bun >=1.4
  # writes `lockfileVersion: 2`, but the Dependabot updater image still
  # bundles Bun 1.3.x, which only reads v1, so every bun job fails with
  # "Unsupported bun.lock 'lockfileVersion' 2". There is no repo-side
  # workaround (the updater binary ignores our bun version). Upstream fix:
  # dependabot/dependabot-core#16071 (ship Bun 1.4, accept v2/v3).
  # Re-enable once that lands. Until then: `bun audit` in CI plus manual
  # `bun update` cover us.
  # - package-ecosystem: bun
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   groups:
  #     frontend:
  #       patterns: ["*"]

  # Rust dependencies (Cargo.lock) – surfaces the next plist/quick-xml/time
  # style advisory as a PR before it can red the security gate.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
