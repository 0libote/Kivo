version: 2
updates:
  # Keep pinned GitHub Actions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Keep both Rust lockfiles maintained during the native port.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-backend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /native-app
    schedule:
      interval: weekly
    groups:
      rust-app:
        patterns: ["*"]
