version: 2
updates:
  # Frontend dependencies (bun lockfile) — REMOVED with the web frontend.
  # The native app is Rust-only; dependency PRs come from the cargo
  # entries below, and `cargo audit` in CI covers advisories.
  # - package-ecosystem: bun
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   groups:
  #     frontend:
  #       patterns: ["*"]

  # Rust dependencies (Cargo.lock) – surfaces the next plist/quick-xml/time
  # style advisory as a PR before it can red the security gate.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-backend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /native-app
    schedule:
      interval: weekly
    groups:
      rust-app:
        patterns: ["*"]
