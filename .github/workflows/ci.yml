name: CI & Build

# Unified pipeline: CI checks -> code/security review -> unsigned beta build.
#
# - pull_request: runs CI + review only (build jobs are skipped).
# - push to main / workflow_dispatch: runs CI, then review, then the rolling
#   unsigned beta (continuous pre-release) only if everything ahead passes.
# Takes longer end-to-end, but a red check anywhere stops the build.
#
# The tag-based `Release` workflow remains the separate signed path for
# stable `app-v*` releases.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# NOTE: no workflow-level concurrency. An earlier revision had
# `group: CI & Build-<ref>` with cancel-in-progress on PRs only, and the
# beta jobs never started on green main pushes/dispatches while it was
# present. Temporary removal to isolate the cause; will restore equivalent
# protection (scoped so it cannot starve betas) once identified.

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun lint
      - run: bun test
      - run: bun run build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Automated code review / security gates. Each gate runs independently so
  # one failure never hides the signal from the others. The `security-gate`
  # aggregator must pass before any beta build starts. It fails the pipeline
  # on: CodeQL findings, known-vulnerable dependencies (bun + cargo), UI
  # test failures, or risky PR dependencies.
  e2e:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        # Local binary (locked via bun.lock), not bunx, so the install
        # always uses exactly the pinned @playwright/test release.
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run UI tests
        run: bun run test:ui
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  codeql:
    name: Code review (CodeQL)
    needs: [frontend, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  audit:
    name: Dependency audit (bun + cargo)
    needs: [frontend, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies (bun)
        run: bun audit
      # Prebuilt cargo-audit binary (~10s). Replaces rustsec/audit-check,
      # which compiled cargo-audit from source (~3min), runs on deprecated
      # Node 20, and needs `checks: write` to post its Check Run (that
      # missing permission failed main as "Resource not accessible by
      # integration"). Plain `cargo audit` fails on vulnerabilities but
      # exits 0 on informational warnings (6x unmaintained unic/
      # proc-macro-error, 1x unsound glib RUSTSEC-2024-0429, transitive via
      # Tauri's Linux tray stack -> gtk 0.18, unfixable short of a GTK 0.20
      # / Tauri upgrade; tracked separately).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock

  dep-review:
    name: Review PR dependency changes
    needs: [frontend, native]
    # Deliberately no job-level `if`: this job must complete (never skip)
    # on every event. When it skipped off-PR, downstream
    # `needs.security-gate.outputs.*` comparisons evaluated false at
    # schedule time even after the gate succeeded with correct outputs
    # (verified empirically), starving the beta jobs. The action itself
    # stays PR-only via the step guard; off-PR the job is checkout + no-op.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Aggregator: keeps one required check and one `needs` target for the beta
  # builds. codeql/audit/e2e run on every event and must be `success` — a
  # `skipped` there means an upstream CI job failed and must not look
  # green. dep-review completes (never skips) on every event: success on
  # PRs, no-op success elsewhere — see its note about downstream outputs.
  security-gate:
    name: Code review / security gate
    needs: [codeql, audit, e2e, dep-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - name: Verify all gates passed
        run: |
          fail=0
          for gate in "codeql:${{ needs.codeql.result }}" "audit:${{ needs.audit.result }}" "e2e:${{ needs.e2e.result }}"; do
            echo "$gate"
            result="${gate##*:}"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          echo "dep-review:${{ needs.dep-review.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.dep-review.result }}" != "success" ]; then
              fail=1
            fi
          elif [ "${{ needs.dep-review.result }}" != "success" ] && [ "${{ needs.dep-review.result }}" != "skipped" ]; then
            fail=1
          fi
          exit $fail
      # Beta eligibility decided here in shell (visible in the gate log)
      # so the beta jobs only do a trivial output comparison. Betas run on
      # manual dispatch (any branch) and on pushes to main — never on PRs.
      - id: decide
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  macos-beta:
    needs: [frontend, native, security-gate]
    if: needs.security-gate.outputs.beta_ready == 'true'
    # Serializes concurrent runs racing the `continuous` delete/create/
    # upload below. (Temporarily removed during beta-starvation diagnosis;
    # proven innocent — the cause was dep-review skipping. Restored.)
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Beta-only fast release tuning. Keeps output in target/release/ (what
      # the Tauri bundler expects) while skipping the fat-LTO single-codegen
      # link from Cargo.toml [profile.release] (stable keeps that).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun test
      - name: Reset the continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta pre-release rebuilt from every commit to main."
      # No APPLE_* / TAURI_SIGNING_* secrets: builds unsigned. No
      # prepare:release step: without TAURI_UPDATER_PUBKEY there are no
      # signed updater artifacts, so this ships a plain beta .dmg.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: continuous
          releaseName: Kivo continuous (beta)
          releaseBody: Rolling unsigned beta pre-release rebuilt from every commit to main. Prefer stable app-v* releases when available.
          releaseDraft: false
          prerelease: true
          args: --target aarch64-apple-darwin
      - name: Stamp release notes with the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta from main ${GITHUB_SHA}. Built $(date -u +%Y-%m-%dT%H:%M:%SZ). Install: macOS - right-click the app and choose Open on first launch. Windows - run the *-setup.exe installer (SmartScreen: More info -> Run anyway). Prefer stable app-v* releases when available."

  windows-beta:
    needs: [macos-beta]
    if: needs.macos-beta.result == 'success'
    # Same `continuous` race protection as macos-beta.
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Same beta-only fast release tuning as macos-beta above. Single NSIS
      # build only (no second MSIX cargo invocation).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No signing keys: the NSIS .exe installs with a bypassable
      # SmartScreen warning ("More info" -> "Run anyway"). NSIS only: no
      # second MSIX cargo build (previously `build-msix.ps1` re-ran
      # `tauri build --no-bundle`, paying the LTO link twice).
      - name: Build unsigned NSIS installer (beta, untrusted)
        run: bun tauri build --bundles nsis
      - name: Attach Windows artifacts to the continuous pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          # Forward slashes: PowerShell accepts them and they avoid YAML
          # backslash-escape confusion.
          gh release upload continuous "src-tauri/target/release/bundle/nsis/Kivo_${version}_x64-setup.exe" --clobber
