name: CI & Build

# Unified pipeline: CI checks -> code/security review -> unsigned beta build.
#
# - pull_request (opened/synchronize/reopened): runs CI + review, then builds
#   Windows + macOS preview bundles for every push and publishes them to a
#   rolling per-PR pre-release (`pr-<number>`) with a sticky PR comment
#   linking direct downloads for live testing. No labels, no manual approval:
#   pushing to the PR is the approval (same-repo PRs only, see below).
# - pull_request (closed): deletes the per-PR pre-release/tag so previews do
#   not accumulate. Only `cleanup-pr-preview` runs on `closed`; every other
#   job skips, so merging never re-runs the suite a second time.
# - push to main / workflow_dispatch: runs CI, then review, then the rolling
#   unsigned beta (continuous pre-release) only if everything ahead passes.
# Takes longer end-to-end, but a red check anywhere stops the build.
#
# The tag-based `Release` workflow remains the separate signed path for
# stable `app-v*` releases.
#
# Fork safety: preview *builds* use no secrets and run on forks (artifacts
# only, in the Actions tab). The `publish-pr` / cleanup jobs need
# `contents:write` + `pull-requests:write`, which fork PRs do not get on the
# `pull_request` event, so they skip on forks (same-repo check on
# `head.repo.full_name`). Same-repo PR authors already have write access,
# so the write token adds no privilege there.
# The publish job checks out the *base* SHA (trusted) and only handles
# build outputs as opaque files, never executing PR code with the token
# that can write releases/comments.
#
# Speed shape (deliberate):
# - `packaging`, `rust-static`, `frontend`, `frontend-windows`, `native`,
#   `e2e`, `codeql`, `audit` and `dep-review` all start immediately. There
#   are no `needs` chains between independent checks, so the slow native
#   builds never gate the fast static gates (previously audit/codeql waited
#   ~30min on `native` before even starting).
# - `rust-static` (cheap ubuntu, seconds) owns rustfmt + the lockfile check;
#   the `native` matrix (macOS + Windows) owns clippy + tests, so each
#   desktop's `#[cfg(target_os)]` sources still compile on every PR. The
#   matrix no longer pays for a bun install (pure-Rust checks) or a
#   duplicated fmt run.
# - Foreign-desktop *logic* (shortcut defaults, cross-OS settings migration,
#   native-shortcut checks, permission requirements) is tested
#   host-parameterized: every runner executes both directions (see
#   `HostPlatform` in src-tauri/src/config plus `check:platform-parity`),
#   instead of `#[cfg]`-gated tests that only ever exercise their own host
#   and let the other desktop drift silently.
# - Concurrency is job-level, never workflow-level: superseded PR pushes
#   cancel in-flight CI jobs, while main pushes/dispatches never cancel, so
#   beta builds cannot starve (a workflow-level group starved them before).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    # `closed` PR events only run `cleanup-pr-preview` (below); without this
    # guard every merge would re-run the whole suite a second time.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run build

  frontend-windows:
    name: Frontend checks (Windows)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # JavaScript is portable, but paths, line endings, and toolchain behavior
    # still differ on Windows. Typecheck + unit tests only; lint and the web
    # build stay on the ubuntu `frontend` job so they are not paid for twice.
    # The static gates also run here (seconds, no extra install) to prove the
    # gate scripts themselves work with Windows paths/line endings.
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun run test
      - run: bun run check:packaging
      - run: bun run check:platform-parity

  packaging:
    name: Packaging + platform parity gates
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Fast static checks (seconds, no compile): packaging metadata agreement
    # plus macOS/Windows branch parity (shortcut defaults, native-shortcut
    # strings, permission requirements, harness matrix). The real bundle
    # builds only run on main/tags, so these gates are what stop packaging
    # or single-OS breakage from merging in a PR.
    # No install step: both scripts use node builtins only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-packaging-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun run check:packaging
      - run: bun run check:platform-parity

  rust-static:
    name: Rust static (fmt, lockfile)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Cheap ubuntu job for everything that needs no compilation: rustfmt
    # parses every file including the `#[cfg(target_os)]` sources that only
    # compile on the other desktop, and `cargo metadata --locked` fails fast
    # on a Cargo.toml/Cargo.lock drift that would otherwise only surface
    # inside the macOS/Windows native builds below.
    # NOTE: full `cargo check/clippy --target <foreign desktop>` was tried
    # here and deliberately dropped: third-party C build scripts (aws-lc-sys
    # for Windows, objc2 helpers for macOS) need that desktop's C toolchain,
    # which no ubuntu runner has. Foreign-target compilation stays covered
    # by the per-OS `native` matrix (every PR compiles both desktops), and
    # foreign-target *logic* is covered without compiling by the
    # host-parameterized unit tests (config/shell/commands) plus
    # `check:platform-parity` in the `packaging` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-rust-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

  native:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Per-OS compile + execution (`cargo clippy`, `cargo test`), so each
    # desktop's `#[cfg(target_os)]` sources build on every PR. Format and
    # lockfile checks live in `rust-static`, and no bun install is needed
    # here (pure-Rust checks), so expensive runners are not billed for work
    # ubuntu already did.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-native-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # Automated code review / security gates. Each gate runs independently and
  # starts immediately (no `needs` on the CI jobs above) so one slow suite
  # never hides the signal from the others. The `security-gate` aggregator
  # must pass before any beta build starts.
  # NOTE: CodeQL only scans javascript-typescript (it has no Rust support);
  # Rust review is clippy -D warnings (per-OS in `native`) plus cargo-audit
  # in the `audit` job, enforced for both desktop targets.
  e2e:
    name: UI tests (Playwright)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Ubuntu + Chromium only (cheap). Both platform branches are still
    # covered: the browser harness derives its platform from
    # navigator.userAgent, and the suite spoofs Windows and macOS agents
    # (see windows-branches.pw.ts, overhaul.pw.ts, summaries.pw.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        # Local binary (locked via bun.lock), not bunx, so the install
        # always uses exactly the pinned @playwright/test release.
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run UI tests
        run: bun run test:ui
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  codeql:
    name: Code review (CodeQL)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-codeql-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  audit:
    name: Dependency audit (bun + cargo)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies (bun)
        run: bun audit
      # Prebuilt cargo-audit binary (~10s). Replaces rustsec/audit-check,
      # which compiled cargo-audit from source (~3min), runs on deprecated
      # Node 20, and needs `checks: write` to post its Check Run (that
      # missing permission failed main as "Resource not accessible by
      # integration"). Plain `cargo audit` fails on vulnerabilities but
      # exits 0 on informational warnings (6x unmaintained unic/
      # proc-macro-error, 1x unsound glib RUSTSEC-2024-0429, transitive via
      # Tauri's Linux tray stack -> gtk 0.18, unfixable short of a GTK 0.20
      # / Tauri upgrade; tracked separately).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock

  dep-review:
    name: Review PR dependency changes
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # Deliberately almost no job-level `if`: this job must complete (never
    # skip) on every event except `closed` (where only cleanup runs and
    # nothing reads this job). When it skipped off-PR, downstream
    # `needs.security-gate.outputs.*` comparisons evaluated false at
    # schedule time even after the gate succeeded with correct outputs
    # (verified empirically), starving the beta jobs. The action itself
    # stays PR-only via the step guard; off-PR the job is checkout + no-op.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-dep-review-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Aggregator: keeps one required check and one `needs` target for the beta
  # builds. codeql/audit/e2e/packaging run on every event and must be
  # `success` — a `skipped` there means an upstream CI job failed and must
  # not look green. dep-review completes (never skips) on every event:
  # success on PRs, no-op success elsewhere — see its note about downstream
  # outputs.
  security-gate:
    name: Code review / security gate
    needs: [codeql, audit, e2e, dep-review, packaging]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - name: Verify all gates passed
        run: |
          fail=0
          for gate in "codeql:${{ needs.codeql.result }}" "audit:${{ needs.audit.result }}" "e2e:${{ needs.e2e.result }}" "packaging:${{ needs.packaging.result }}"; do
            echo "$gate"
            result="${gate##*:}"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          echo "dep-review:${{ needs.dep-review.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.dep-review.result }}" != "success" ]; then
              fail=1
            fi
          elif [ "${{ needs.dep-review.result }}" != "success" ] && [ "${{ needs.dep-review.result }}" != "skipped" ]; then
            fail=1
          fi
          exit $fail
      # Beta eligibility decided here in shell (visible in the gate log)
      # so the beta jobs only do a trivial output comparison. Betas run on
      # manual dispatch (any branch) and on pushes to main — never on PRs.
      - id: decide
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Beta delivery. The two desktop builds run IN PARALLEL and hand off via
  # short-lived, run-scoped artifacts. A single `publish-continuous` job
  # owns every mutation of the `continuous` release (delete/recreate, asset
  # uploads, notes), so overlapping main pushes serialize there while the
  # slow builders overlap. Beta wall time drops from ~7min serial to ~4.5min
  # (the slower builder plus seconds to publish).
  macos-beta:
    needs: [frontend, frontend-windows, native, rust-static, security-gate]
    if: needs.security-gate.outputs.beta_ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Beta-only fast release tuning. Keeps output in target/release/ (what
      # the Tauri bundler expects) while skipping the fat-LTO single-codegen
      # link from Cargo.toml [profile.release] (stable keeps that).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No typecheck/test rerun: this is the same SHA the `frontend` and
      # `native` gates just passed, so rerunning them only burns macOS
      # minutes (`windows-beta` never reran them either).
      # No APPLE_* / TAURI_SIGNING_* secrets: builds ad-hoc signed
      # (signingIdentity "-" in tauri.conf.json, free). No prepare:release
      # step: without TAURI_UPDATER_PUBKEY there are no signed updater
      # artifacts, so this ships a plain beta .dmg that needs a one-time
      # Privacy & Security approval on first launch (see release notes).
      - name: Build ad-hoc signed app bundle (beta)
        run: bun tauri build --target aarch64-apple-darwin
      - name: Upload bundle for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-macos
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          # NOTE: explicit `--target` redirects cargo output to
          # target/<triple>/release, not target/release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  windows-beta:
    needs: [frontend, frontend-windows, native, rust-static, security-gate]
    if: needs.security-gate.outputs.beta_ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as macos-beta above. Single NSIS
      # build only (no second MSIX cargo invocation).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No signing keys: the NSIS .exe installs with a bypassable
      # SmartScreen warning ("More info" -> "Run anyway"). NSIS only: no
      # second MSIX cargo build (previously `build-msix.ps1` re-ran
      # `tauri build --no-bundle`, paying the LTO link twice).
      - name: Build unsigned NSIS installer (beta, untrusted)
        run: bun tauri build --bundles nsis
      - name: Upload installer for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-windows
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  publish-continuous:
    name: Publish the continuous pre-release
    # Owns every mutation of the `continuous` release (delete/recreate,
    # asset uploads, notes) so overlapping main pushes serialize here
    # while the builders above overlap. Asset names match what the old
    # tauri-action/gh flow shipped (dmg + app tarball + setup exe).
    needs: [macos-beta, windows-beta]
    if: needs.macos-beta.result == 'success' && needs.windows-beta.result == 'success'
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-beta-macos
          path: beta/macos
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-beta-windows
          path: beta/windows
      - name: Publish assets to the continuous pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # upload-artifact preserves the matched parents (dmg/…, macos/…),
          # so locate by name instead of assuming a flat layout.
          dmg="$(find beta/macos -maxdepth 3 -name '*.dmg' | head -n 1)"
          appdir="$(find beta/macos -maxdepth 3 -name '*.app' | head -n 1)"
          exe="$(find beta/windows -name '*-setup.exe' | head -n 1)"
          test -n "$dmg" || { echo "macOS dmg not found in artifact"; exit 1; }
          test -n "$appdir" || { echo "macOS .app not found in artifact"; exit 1; }
          test -n "$exe" || { echo "Windows installer not found in artifact"; exit 1; }
          tarball="beta/Kivo_${version}_aarch64.app.tar.gz"
          tar -czf "$tarball" -C "$(dirname "$appdir")" "$(basename "$appdir")"
          # Rolling beta manifest for the in-app updater. The version number
          # rarely changes between betas, so the app detects new builds by
          # commit SHA (see check_for_updates in src-tauri/src/shell.rs).
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$version" BUILT_AT="$built_at" node -e "const fs = require('node:fs'); fs.writeFileSync('beta/continuous.json', JSON.stringify({ version: process.env.VERSION, sha: process.env.GITHUB_SHA, builtAt: process.env.BUILT_AT }, null, 2) + '\n');"
          gh release delete continuous --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta pre-release rebuilt from every commit to main."
          gh release upload continuous "$dmg" "$tarball" "$exe" beta/continuous.json --clobber
          gh release edit continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling ad-hoc-signed beta from main ${GITHUB_SHA}. Built $(date -u +%Y-%m-%dT%H:%M:%SZ). macOS (Apple Silicon, macOS 26+): easiest is curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/0libote/Kivo/main/scripts/install-macos.sh | bash. Manual DMG install: drag Kivo.app to /Applications, then run xattr -dr com.apple.quarantine /Applications/Kivo.app once and approve in System Settings > Privacy & Security on first launch (right-click > Open no longer bypasses Gatekeeper on recent macOS; do NOT trash the app, it is not damaged). Windows: run the *-setup.exe installer (SmartScreen: More info -> Run anyway). Prefer stable app-v* releases when available."

  windows-pr:
    name: Windows PR preview
    # Auto-builds on every PR push (opened/synchronize/reopened): pushing is
    # the approval, no labels. Waits for the compile gates so broken code
    # does not burn Windows minutes. Unsigned NSIS installer, same
    # fast-release tuning as windows-beta. No secrets are used, so this is
    # safe on forks (forks get the run artifact; direct release downloads
    # are same-repo only, see `publish-pr`).
    needs: [frontend, frontend-windows, native, rust-static, packaging]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ci-windows-bundle-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as windows-beta: this is a smoke
      # check, not a shippable artifact.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so testers
      # can tell same-version previews apart by commit.
      KIVO_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - name: Build unsigned NSIS installer (PR preview)
        run: bun tauri build --bundles nsis
      - name: Upload installer for the preview publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-windows-nsis-pr
          # Handoff consumed minutes later by `publish-pr`; humans download
          # from the per-PR release linked in the sticky PR comment.
          retention-days: 1
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  macos-pr:
    name: macOS PR preview
    # Auto-build mirror of `windows-pr` above (see its approval note).
    # Without this job, macOS-only bundle breakage (icons, entitlements,
    # Swift bridge, dmg config) merges and fails the beta on main instead
    # of the PR. No secrets are used, so this is also safe on forks.
    needs: [frontend, frontend-windows, native, rust-static, packaging]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: ci-macos-bundle-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as macos-beta: this is a smoke
      # check, not a shippable artifact.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so testers
      # can tell same-version previews apart by commit.
      KIVO_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - name: Build ad-hoc signed app bundle (PR preview)
        run: bun tauri build --target aarch64-apple-darwin
      - name: Upload bundle for the preview publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-macos-bundle-pr
          # Handoff consumed minutes later by `publish-pr`; humans download
          # from the per-PR release linked in the sticky PR comment.
          retention-days: 1
          # NOTE: explicit `--target` redirects cargo output to
          # target/<triple>/release, not target/release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  publish-pr:
    name: Publish PR preview downloads
    # Collects the platform bundles built above into a rolling per-PR
    # pre-release (`pr-<number>`) and posts/updates one sticky PR comment
    # with direct download links for live testing. `always()` plus the
    # per-result guards mean one red platform does not block the other's
    # preview. Runs with a write token but never executes PR code: the
    # checkout is pinned to the trusted base SHA and the artifacts are
    # handled as opaque files. Same-repo PRs only — fork PRs keep the run
    # artifacts (their GITHUB_TOKEN is read-only on `pull_request`).
    needs: [windows-pr, macos-pr]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && (needs.windows-pr.result == 'success' || needs.macos-pr.result == 'success')
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Trusted base code, NOT the PR head: this job runs with a token
          # that can write releases and PR comments.
          ref: ${{ github.event.pull_request.base.sha }}
      - id: gate
        name: Skip if the PR is already closed or merged
        # Closes the merge race: a sync run's slow builders can finish AFTER
        # the PR merged and `cleanup-pr-preview` deleted the preview. Without
        # this, publish would recreate the `pr-<number>` release after
        # cleanup (observed with pr-14 on 2026-09-16). Later steps run only
        # while the PR is OPEN.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "PR #${PR_NUMBER} state: ${STATE}"
          if [ "$STATE" = "OPEN" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download Windows installer
        if: needs.windows-pr.result == 'success' && steps.gate.outputs.should_publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-windows-nsis-pr
          path: preview/windows
      - name: Download macOS bundle
        if: needs.macos-pr.result == 'success' && steps.gate.outputs.should_publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-macos-bundle-pr
          path: preview/macos
      - id: publish
        name: Publish assets to the per-PR pre-release
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="pr-${PR_NUMBER}"
          SHORT="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
          VERSION="$(node -p "require('./package.json').version")"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          EXE="$(find preview/windows -name '*-setup.exe' 2>/dev/null | head -n 1 || true)"
          DMG="$(find preview/macos -maxdepth 3 -name '*.dmg' 2>/dev/null | head -n 1 || true)"
          APPDIR="$(find preview/macos -maxdepth 3 -name '*.app' 2>/dev/null | head -n 1 || true)"
          if [ -z "$EXE" ] && [ -z "$DMG" ] && [ -z "$APPDIR" ]; then
            echo "No preview assets found; nothing to publish."
            exit 1
          fi
          TARBALL=""
          if [ -n "$APPDIR" ]; then
            TARBALL="preview/Kivo_${VERSION}_pr${PR_NUMBER}_aarch64.app.tar.gz"
            tar -czf "$TARBALL" -C "$(dirname "$APPDIR")" "$(basename "$APPDIR")"
          fi
          MANIFEST="preview/kivo-pr-${PR_NUMBER}.json"
          PR_NUMBER="$PR_NUMBER" HEAD_SHA="$HEAD_SHA" VERSION="$VERSION" BUILT_AT="$BUILT_AT" RUN_ID="$RUN_ID" MANIFEST="$MANIFEST" node <<'NODE_EOF'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.MANIFEST, JSON.stringify({
            pr: Number(process.env.PR_NUMBER),
            sha: process.env.HEAD_SHA,
            version: process.env.VERSION,
            builtAt: process.env.BUILT_AT,
            runId: Number(process.env.RUN_ID),
          }, null, 2) + '\n');
          NODE_EOF
          gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "$TAG" \
            --prerelease \
            --title "Kivo PR #${PR_NUMBER} preview" \
            --target "$HEAD_SHA" \
            --notes "Ephemeral live-testing preview for PR #${PR_NUMBER} at ${HEAD_SHA}. Rebuilt on every push; deleted when the PR closes. Workflow run: ${RUN_URL}"
          ASSETS=()
          if [ -n "$EXE" ]; then ASSETS+=("$EXE"); fi
          if [ -n "$DMG" ]; then ASSETS+=("$DMG"); fi
          if [ -n "$TARBALL" ]; then ASSETS+=("$TARBALL"); fi
          ASSETS+=("$MANIFEST")
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          if [ -n "$EXE" ]; then echo "exe_name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"; else echo "exe_name=" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$DMG" ]; then echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"; else echo "dmg_name=" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$TARBALL" ]; then echo "tarball_name=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"; else echo "tarball_name=" >> "$GITHUB_OUTPUT"; fi
          echo "manifest_name=$(basename "$MANIFEST")" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"
      - name: Post or update the sticky preview comment
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          EXE_NAME: ${{ steps.publish.outputs.exe_name }}
          DMG_NAME: ${{ steps.publish.outputs.dmg_name }}
          TARBALL_NAME: ${{ steps.publish.outputs.tarball_name }}
          MANIFEST_NAME: ${{ steps.publish.outputs.manifest_name }}
          VERSION: ${{ steps.publish.outputs.version }}
          SHORT_SHA: ${{ steps.publish.outputs.short_sha }}
          BUILT_AT: ${{ steps.publish.outputs.built_at }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="pr-${PR_NUMBER}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          REPO="$REPO" TAG="$TAG" PR_NUMBER="$PR_NUMBER" HEAD_SHA="$HEAD_SHA" SHORT_SHA="$SHORT_SHA" RUN_URL="$RUN_URL" VERSION="$VERSION" BUILT_AT="$BUILT_AT" EXE_NAME="$EXE_NAME" DMG_NAME="$DMG_NAME" TARBALL_NAME="$TARBALL_NAME" MANIFEST_NAME="$MANIFEST_NAME" node <<'NODE_EOF'
          const fs = require('node:fs');
          const e = process.env;
          const dl = (name) => `https://github.com/${e.REPO}/releases/download/${e.TAG}/${encodeURIComponent(name)}`;
          const lines = [];
          lines.push('<!-- kivo-pr-preview -->');
          lines.push(`## PR preview builds (#${e.PR_NUMBER} @ \`${e.SHORT_SHA}\`)`);
          lines.push('');
          lines.push('Live-testing downloads built from this PR. Rebuilt on every push; deleted when the PR closes.');
          lines.push('');
          if (e.EXE_NAME) lines.push(`- Windows: [${e.EXE_NAME}](${dl(e.EXE_NAME)})`);
          else lines.push('- Windows: build failed — see the workflow run logs.');
          if (e.DMG_NAME) lines.push(`- macOS (Apple Silicon, dmg): [${e.DMG_NAME}](${dl(e.DMG_NAME)})`);
          else lines.push('- macOS (dmg): build failed — see the workflow run logs.');
          if (e.TARBALL_NAME) lines.push(`- macOS (app tarball): [${e.TARBALL_NAME}](${dl(e.TARBALL_NAME)})`);
          lines.push('');
          lines.push(`Commit: \`${e.HEAD_SHA}\` · version ${e.VERSION} · built ${e.BUILT_AT} · [workflow run](${e.RUN_URL})`);
          lines.push('');
          lines.push('Unsigned test builds, not releases: Windows shows a SmartScreen warning (More info -> Run anyway). macOS is ad-hoc signed: after dragging Kivo.app to /Applications, run `xattr -dr com.apple.quarantine /Applications/Kivo.app` once and approve in System Settings > Privacy & Security on first launch.');
          lines.push('');
          lines.push(`Manifest: [${e.MANIFEST_NAME}](${dl(e.MANIFEST_NAME)})`);
          fs.writeFileSync('preview/comment.md', lines.join('\n') + '\n');
          NODE_EOF
          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate -q '.[] | select(.body | contains("<!-- kivo-pr-preview -->")) | .id' | head -n 1 || true)"
          if [ -n "$EXISTING" ]; then
            node -e "const fs=require('node:fs');fs.writeFileSync('preview/payload.json',JSON.stringify({body:fs.readFileSync('preview/comment.md','utf8')}));"
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH --input preview/payload.json > /dev/null
            echo "Updated preview comment ${EXISTING}."
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file preview/comment.md
            echo "Posted new preview comment."
          fi

  cleanup-pr-preview:
    name: Cleanup PR preview release
    # Deletes the rolling `pr-<number>` pre-release/tag when the PR closes
    # (merged or not) so previews do not accumulate. Same-repo only,
    # mirroring `publish-pr` (forks never created one).
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Delete the ephemeral preview release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="pr-${PR_NUMBER}"
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "No preview release ${TAG}; nothing to delete."
            exit 0
          fi
          # No `|| true` masking here by design: on 2026-09-16 the delete
          # failed silently and the pr-14 preview survived the merge. Retry,
          # verify, and fail loudly instead of reporting false success.
          for attempt in 1 2 3; do
            if gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag; then
              break
            fi
            echo "Attempt ${attempt} to delete ${TAG} failed; retrying..."
            sleep 10
          done
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release ${TAG} still exists after delete attempts."
            exit 1
          fi
          if git ls-remote --tags "https://github.com/${REPO}.git" "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} survived --cleanup-tag; deleting the ref directly."
            gh api "repos/${REPO}/git/refs/tags/${TAG}" -X DELETE
          fi
          echo "Preview release ${TAG} deleted."
      - name: Retire the sticky preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate -q '.[] | select(.body | contains("<!-- kivo-pr-preview -->")) | .id' | head -n 1 || true)"
          if [ -n "$EXISTING" ]; then
            printf '<!-- kivo-pr-preview -->\n## PR preview builds (retired)\n\nThis PR is closed, so its ephemeral preview downloads were deleted.\n' > /tmp/retired.md
            node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/payload.json',JSON.stringify({body:fs.readFileSync('/tmp/retired.md','utf8')}));"
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH --input /tmp/payload.json > /dev/null
            echo "Retired preview comment ${EXISTING}."
          else
            echo "No preview comment to retire."
          fi
