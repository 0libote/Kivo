name: CI & Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      native: ${{ steps.scope.outputs.native }}
      desktop: ${{ steps.scope.outputs.desktop }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/classify-changes.ts
  verify:
    needs: changes
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: true
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      native: ${{ needs.changes.outputs.native == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      website: ${{ needs.changes.outputs.website == 'true' }}
  dep-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
  security-gate:
    # Preserve this external name: it is required by branch protection.
    name: Code review / security gate
    needs: [changes, verify, dep-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          DEP_REVIEW: ${{ needs.dep-review.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHANGES" = success
          test "$VERIFY" = success
          if [ "$EVENT" = pull_request ]; then test "$DEP_REVIEW" = success; else test "$DEP_REVIEW" = skipped; fi
      - id: decide
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo 'beta_ready=true' >> "$GITHUB_OUTPUT"
  windows-beta:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: continuous-build
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Beta-only fast release tuning. NSIS is the
      # only Windows route: a single bundle build, no second packaging pass.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/setup-native
        with:
          profile: beta
      - run: bun install --frozen-lockfile --ignore-scripts
      # The updater archive is signed with Tauri's key; the manual .exe
      # remains unsigned and may display a SmartScreen warning.
      - run: bun run prepare:release
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      - name: Build unsigned NSIS installer (beta, untrusted)
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          bun tauri build --bundles nsis --config src-tauri/target/release-tauri.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Beta installer build failed.' }
          $timer.Stop()
          "Beta build: $($timer.Elapsed.TotalSeconds.ToString('F1')) seconds" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | ForEach-Object { "Installer: $($_.Length) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Signed-version binding: `tauri build` signs
      # for the plain package version, but continuous.json announces
      # `version+sha`. Re-sign the NSIS updater bundle for the exact manifest
      # version so the updater plugin accepts it.
      - name: Re-sign Windows updater archive for the beta version
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $env:KIVO_BUILD_SHA) { throw 'KIVO_BUILD_SHA is required.' }
          $betaVersion = "$version+$env:KIVO_BUILD_SHA"
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows updater archive not found for re-sign.' }
          bun tauri signer sign --app-version $betaVersion $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater re-sign failed.' }
      - name: Native cache footprint
        if: always()
        shell: bash
        run: du -sh src-tauri/target >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installer for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: kivo-beta-windows
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          # Tauri v2 (`createUpdaterArtifacts: true`) re-uses the NSIS
          # installer itself as the update bundle and signs it in place, so
          # the artifacts are `-setup.exe` + `-setup.exe.sig`. The legacy
          # `-setup.nsis.zip` pair is only produced by `v1Compatible`.
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  publish-continuous:
    name: Publish the continuous pre-release
    # Owns every mutation of the `continuous` release (asset uploads and
    # notes) so overlapping main pushes serialize here
    # while superseded builders cancel. Installers/signatures are immutable.
    needs: [windows-beta, security-gate]
    if: github.ref == 'refs/heads/main' && needs.windows-beta.result == 'success' && needs.security-gate.result == 'success' && needs.security-gate.outputs.beta_ready == 'true'
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kivo-beta-windows
          path: beta/windows
      - name: Stage immutable installer and manifest
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find beta/windows -name '*-setup.exe' -print -quit)"
          test -n "$installer"
          KIVO_VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          export KIVO_VERSION
          immutable="$(bun scripts/build-continuous-manifest.ts "$installer")"
          printf 'KIVO_BETA_INSTALLER=%s\n' "$immutable" >> "$GITHUB_ENV"
      - name: Promote current main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-continuous.ts "$KIVO_BETA_INSTALLER"
