name: CI & Build

# Unified pipeline: CI checks -> code/security review -> unsigned beta build.
#
# - pull_request: runs CI + review only (build jobs are skipped), except the
#   approval-gated `windows-bundle-pr` / `macos-bundle-pr` jobs: a maintainer
#   adds the `test-windows-build` / `test-macos-build` label as the approval
#   (labels need write access, so the label IS the approval, even for owner
#   commits) to get a real installer for that PR.
# - push to main / workflow_dispatch: runs CI, then review, then the rolling
#   unsigned beta (continuous pre-release) only if everything ahead passes.
# Takes longer end-to-end, but a red check anywhere stops the build.
#
# The tag-based `Release` workflow remains the separate signed path for
# stable `app-v*` releases.
#
# Speed shape (deliberate):
# - `packaging`, `rust-static`, `frontend`, `frontend-windows`, `native`,
#   `e2e`, `codeql`, `audit` and `dep-review` all start immediately. There
#   are no `needs` chains between independent checks, so the slow native
#   builds never gate the fast static gates (previously audit/codeql waited
#   ~30min on `native` before even starting).
# - `rust-static` (cheap ubuntu, seconds) owns rustfmt + the lockfile check;
#   the `native` matrix (macOS + Windows) owns clippy + tests, so each
#   desktop's `#[cfg(target_os)]` sources still compile on every PR. The
#   matrix no longer pays for a bun install (pure-Rust checks) or a
#   duplicated fmt run.
# - Foreign-desktop *logic* (shortcut defaults, cross-OS settings migration,
#   native-shortcut checks, permission requirements) is tested
#   host-parameterized: every runner executes both directions (see
#   `HostPlatform` in src-tauri/src/config plus `check:platform-parity`),
#   instead of `#[cfg]`-gated tests that only ever exercise their own host
#   and let the other desktop drift silently.
# - Concurrency is job-level, never workflow-level: superseded PR pushes
#   cancel in-flight CI jobs, while main pushes/dispatches never cancel, so
#   beta builds cannot starve (a workflow-level group starved them before).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run build

  frontend-windows:
    name: Frontend checks (Windows)
    # JavaScript is portable, but paths, line endings, and toolchain behavior
    # still differ on Windows. Typecheck + unit tests only; lint and the web
    # build stay on the ubuntu `frontend` job so they are not paid for twice.
    # The static gates also run here (seconds, no extra install) to prove the
    # gate scripts themselves work with Windows paths/line endings.
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun run test
      - run: bun run check:packaging
      - run: bun run check:platform-parity

  packaging:
    name: Packaging + platform parity gates
    # Fast static checks (seconds, no compile): packaging metadata agreement
    # plus macOS/Windows branch parity (shortcut defaults, native-shortcut
    # strings, permission requirements, harness matrix). The real bundle
    # builds only run on main/tags, so these gates are what stop packaging
    # or single-OS breakage from merging in a PR.
    # No install step: both scripts use node builtins only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-packaging-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun run check:packaging
      - run: bun run check:platform-parity

  rust-static:
    name: Rust static (fmt, lockfile)
    # Cheap ubuntu job for everything that needs no compilation: rustfmt
    # parses every file including the `#[cfg(target_os)]` sources that only
    # compile on the other desktop, and `cargo metadata --locked` fails fast
    # on a Cargo.toml/Cargo.lock drift that would otherwise only surface
    # inside the macOS/Windows native builds below.
    # NOTE: full `cargo check/clippy --target <foreign desktop>` was tried
    # here and deliberately dropped: third-party C build scripts (aws-lc-sys
    # for Windows, objc2 helpers for macOS) need that desktop's C toolchain,
    # which no ubuntu runner has. Foreign-target compilation stays covered
    # by the per-OS `native` matrix (every PR compiles both desktops), and
    # foreign-target *logic* is covered without compiling by the
    # host-parameterized unit tests (config/shell/commands) plus
    # `check:platform-parity` in the `packaging` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-rust-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

  native:
    # Per-OS compile + execution (`cargo clippy`, `cargo test`), so each
    # desktop's `#[cfg(target_os)]` sources build on every PR. Format and
    # lockfile checks live in `rust-static`, and no bun install is needed
    # here (pure-Rust checks), so expensive runners are not billed for work
    # ubuntu already did.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-native-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # Automated code review / security gates. Each gate runs independently and
  # starts immediately (no `needs` on the CI jobs above) so one slow suite
  # never hides the signal from the others. The `security-gate` aggregator
  # must pass before any beta build starts.
  # NOTE: CodeQL only scans javascript-typescript (it has no Rust support);
  # Rust review is clippy -D warnings (per-OS in `native`) plus cargo-audit
  # in the `audit` job, enforced for both desktop targets.
  e2e:
    name: UI tests (Playwright)
    # Ubuntu + Chromium only (cheap). Both platform branches are still
    # covered: the browser harness derives its platform from
    # navigator.userAgent, and the suite spoofs Windows and macOS agents
    # (see windows-branches.pw.ts, overhaul.pw.ts, summaries.pw.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        # Local binary (locked via bun.lock), not bunx, so the install
        # always uses exactly the pinned @playwright/test release.
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run UI tests
        run: bun run test:ui
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  codeql:
    name: Code review (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-codeql-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  audit:
    name: Dependency audit (bun + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies (bun)
        run: bun audit
      # Prebuilt cargo-audit binary (~10s). Replaces rustsec/audit-check,
      # which compiled cargo-audit from source (~3min), runs on deprecated
      # Node 20, and needs `checks: write` to post its Check Run (that
      # missing permission failed main as "Resource not accessible by
      # integration"). Plain `cargo audit` fails on vulnerabilities but
      # exits 0 on informational warnings (6x unmaintained unic/
      # proc-macro-error, 1x unsound glib RUSTSEC-2024-0429, transitive via
      # Tauri's Linux tray stack -> gtk 0.18, unfixable short of a GTK 0.20
      # / Tauri upgrade; tracked separately).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock

  dep-review:
    name: Review PR dependency changes
    # Deliberately no job-level `if`: this job must complete (never skip)
    # on every event. When it skipped off-PR, downstream
    # `needs.security-gate.outputs.*` comparisons evaluated false at
    # schedule time even after the gate succeeded with correct outputs
    # (verified empirically), starving the beta jobs. The action itself
    # stays PR-only via the step guard; off-PR the job is checkout + no-op.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-dep-review-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Aggregator: keeps one required check and one `needs` target for the beta
  # builds. codeql/audit/e2e/packaging run on every event and must be
  # `success` — a `skipped` there means an upstream CI job failed and must
  # not look green. dep-review completes (never skips) on every event:
  # success on PRs, no-op success elsewhere — see its note about downstream
  # outputs.
  security-gate:
    name: Code review / security gate
    needs: [codeql, audit, e2e, dep-review, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - name: Verify all gates passed
        run: |
          fail=0
          for gate in "codeql:${{ needs.codeql.result }}" "audit:${{ needs.audit.result }}" "e2e:${{ needs.e2e.result }}" "packaging:${{ needs.packaging.result }}"; do
            echo "$gate"
            result="${gate##*:}"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          echo "dep-review:${{ needs.dep-review.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.dep-review.result }}" != "success" ]; then
              fail=1
            fi
          elif [ "${{ needs.dep-review.result }}" != "success" ] && [ "${{ needs.dep-review.result }}" != "skipped" ]; then
            fail=1
          fi
          exit $fail
      # Beta eligibility decided here in shell (visible in the gate log)
      # so the beta jobs only do a trivial output comparison. Betas run on
      # manual dispatch (any branch) and on pushes to main — never on PRs.
      - id: decide
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Beta delivery. The two desktop builds run IN PARALLEL and hand off via
  # short-lived, run-scoped artifacts. A single `publish-continuous` job
  # owns every mutation of the `continuous` release (delete/recreate, asset
  # uploads, notes), so overlapping main pushes serialize there while the
  # slow builders overlap. Beta wall time drops from ~7min serial to ~4.5min
  # (the slower builder plus seconds to publish).
  macos-beta:
    needs: [frontend, frontend-windows, native, rust-static, security-gate]
    if: needs.security-gate.outputs.beta_ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Beta-only fast release tuning. Keeps output in target/release/ (what
      # the Tauri bundler expects) while skipping the fat-LTO single-codegen
      # link from Cargo.toml [profile.release] (stable keeps that).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No typecheck/test rerun: this is the same SHA the `frontend` and
      # `native` gates just passed, so rerunning them only burns macOS
      # minutes (`windows-beta` never reran them either).
      # No APPLE_* / TAURI_SIGNING_* secrets: builds ad-hoc signed
      # (signingIdentity "-" in tauri.conf.json, free). No prepare:release
      # step: without TAURI_UPDATER_PUBKEY there are no signed updater
      # artifacts, so this ships a plain beta .dmg that needs a one-time
      # Privacy & Security approval on first launch (see release notes).
      - name: Build ad-hoc signed app bundle (beta)
        run: bun tauri build --target aarch64-apple-darwin
      - name: Upload bundle for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-macos
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          # NOTE: explicit `--target` redirects cargo output to
          # target/<triple>/release, not target/release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  windows-beta:
    needs: [frontend, frontend-windows, native, rust-static, security-gate]
    if: needs.security-gate.outputs.beta_ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as macos-beta above. Single NSIS
      # build only (no second MSIX cargo invocation).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No signing keys: the NSIS .exe installs with a bypassable
      # SmartScreen warning ("More info" -> "Run anyway"). NSIS only: no
      # second MSIX cargo build (previously `build-msix.ps1` re-ran
      # `tauri build --no-bundle`, paying the LTO link twice).
      - name: Build unsigned NSIS installer (beta, untrusted)
        run: bun tauri build --bundles nsis
      - name: Upload installer for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-windows
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  publish-continuous:
    name: Publish the continuous pre-release
    # Owns every mutation of the `continuous` release (delete/recreate,
    # asset uploads, notes) so overlapping main pushes serialize here
    # while the builders above overlap. Asset names match what the old
    # tauri-action/gh flow shipped (dmg + app tarball + setup exe).
    needs: [macos-beta, windows-beta]
    if: needs.macos-beta.result == 'success' && needs.windows-beta.result == 'success'
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-beta-macos
          path: beta/macos
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kivo-beta-windows
          path: beta/windows
      - name: Publish assets to the continuous pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # upload-artifact preserves the matched parents (dmg/…, macos/…),
          # so locate by name instead of assuming a flat layout.
          dmg="$(find beta/macos -maxdepth 3 -name '*.dmg' | head -n 1)"
          appdir="$(find beta/macos -maxdepth 3 -name '*.app' | head -n 1)"
          exe="$(find beta/windows -name '*-setup.exe' | head -n 1)"
          test -n "$dmg" || { echo "macOS dmg not found in artifact"; exit 1; }
          test -n "$appdir" || { echo "macOS .app not found in artifact"; exit 1; }
          test -n "$exe" || { echo "Windows installer not found in artifact"; exit 1; }
          tarball="beta/Kivo_${version}_aarch64.app.tar.gz"
          tar -czf "$tarball" -C "$(dirname "$appdir")" "$(basename "$appdir")"
          # Rolling beta manifest for the in-app updater. The version number
          # rarely changes between betas, so the app detects new builds by
          # commit SHA (see check_for_updates in src-tauri/src/shell.rs).
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$version" BUILT_AT="$built_at" node -e "const fs = require('node:fs'); fs.writeFileSync('beta/continuous.json', JSON.stringify({ version: process.env.VERSION, sha: process.env.GITHUB_SHA, builtAt: process.env.BUILT_AT }, null, 2) + '\n');"
          gh release delete continuous --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta pre-release rebuilt from every commit to main."
          gh release upload continuous "$dmg" "$tarball" "$exe" beta/continuous.json --clobber
          gh release edit continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling ad-hoc-signed beta from main ${GITHUB_SHA}. Built $(date -u +%Y-%m-%dT%H:%M:%SZ). macOS (Apple Silicon, macOS 26+): easiest is curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/0libote/Kivo/main/scripts/install-macos.sh | bash. Manual DMG install: drag Kivo.app to /Applications, then run xattr -dr com.apple.quarantine /Applications/Kivo.app once and approve in System Settings > Privacy & Security on first launch (right-click > Open no longer bypasses Gatekeeper on recent macOS; do NOT trash the app, it is not damaged). Windows: run the *-setup.exe installer (SmartScreen: More info -> Run anyway). Prefer stable app-v* releases when available."

  windows-bundle-pr:
    name: Windows bundle build (approval-gated)
    # Approval model: PRs do NOT build the Windows installer by default.
    # A maintainer approves a build by adding the `test-windows-build`
    # label — applying labels requires write access, so the label IS the
    # approval, even for owner commits. Removing the label cancels queued
    # runs. The unsigned .exe is kept as a short-lived run artifact for
    # manual smoke-testing only, never attached to a release. No secrets
    # are used, so this is also safe on forks.
    needs: [frontend, frontend-windows, native, rust-static, packaging]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-windows-build')
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ci-windows-bundle-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as windows-beta: this is a smoke
      # check, not a shippable artifact.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - name: Build unsigned NSIS installer (approval-gated PR check)
        run: bun tauri build --bundles nsis
      - name: Upload installer for manual smoke-testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-windows-nsis-pr
          retention-days: 7
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  macos-bundle-pr:
    name: macOS bundle build (approval-gated)
    # Approval model mirrors `windows-bundle-pr`: PRs do NOT build the macOS
    # bundle by default (macOS runners are the most expensive minutes). A
    # maintainer approves with the `test-macos-build` label. Without this
    # job, macOS-only bundle breakage (icons, entitlements, Swift bridge,
    # dmg config) merges and fails the beta on main instead of the PR.
    # No secrets are used, so this is also safe on forks.
    needs: [frontend, frontend-windows, native, rust-static, packaging]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-macos-build')
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: ci-macos-bundle-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as macos-beta: this is a smoke
      # check, not a shippable artifact.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - name: Build ad-hoc signed app bundle (approval-gated PR check)
        run: bun tauri build --target aarch64-apple-darwin
      - name: Upload bundle for manual smoke-testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-macos-bundle-pr
          retention-days: 7
          # NOTE: explicit `--target` redirects cargo output to
          # target/<triple>/release, not target/release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
