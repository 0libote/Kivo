name: CI & Build

# Unified pipeline: checks and unsigned beta builds -> gated publication.
#
# - pull_request: runs CI + review only.
# - push to main / workflow_dispatch: runs CI and builds the unsigned beta
#   in parallel, then publishes it only after every required check passes.
#
# The tag-based `Release` workflow remains the separate signed path for
# stable `app-v*` releases.
#
# Speed shape (deliberate):
# - `packaging`, `rust-static`, `frontend`, `frontend-windows`, `native`,
#   `e2e`, `codeql`, `audit` and `dep-review` all start immediately. There
#   are no `needs` chains between independent checks, so the slow native
#   builds never gate the fast static gates (previously audit/codeql waited
#   ~30min on `native` before even starting).
# - `rust-static` (cheap ubuntu, seconds) owns rustfmt + the lockfile check;
#   the `native` matrix (macOS + Windows) owns clippy + tests, so each
#   desktop's `#[cfg(target_os)]` sources still compile on every PR. The
#   PRs also exercise installer bundling after the native checks.
# - Foreign-desktop *logic* (shortcut defaults, cross-OS settings migration,
#   native-shortcut checks, permission requirements) is tested
#   host-parameterized: every runner executes both directions (see
#   `HostPlatform` in src-tauri/src/config plus `check:platform-parity`),
#   instead of `#[cfg]`-gated tests that only ever exercise their own host
#   and let the other desktop drift silently.
# - Concurrency is job-level, never workflow-level: superseded PR pushes
#   cancel in-flight CI jobs, while main pushes/dispatches never cancel, so
#   beta builds cannot starve (a workflow-level group starved them before).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun run format:check
      - run: bun lint
      - run: bun run knip
      - run: bun run theme:check
      - run: bun run test
      - run: bun run check:bridge
      - run: bun run build

  frontend-windows:
    name: Frontend checks (Windows)
    # JavaScript is portable, but paths, line endings, and toolchain behavior
    # still differ on Windows. Typecheck + unit tests only; lint and the web
    # build stay on the ubuntu `frontend` job so they are not paid for twice.
    # The static gates also run here (seconds, no extra install) to prove the
    # gate scripts themselves work with Windows paths/line endings.
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ci-frontend-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun run test
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - run: bun run check:bridge

  packaging:
    name: Packaging + platform parity gates
    # Fast static checks (seconds, no compile): packaging metadata agreement
    # plus macOS/Windows branch parity (shortcut defaults, native-shortcut
    # strings, permission requirements, harness matrix). The real bundle
    # builds only run on main/tags, so these gates are what stop packaging
    # or single-OS breakage from merging in a PR.
    # No install step: both scripts use node builtins only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-packaging-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - run: bun run check:bridge

  rust-static:
    name: Rust static (fmt, lockfile)
    # Cheap ubuntu job for everything that needs no compilation: rustfmt
    # parses every file including the `#[cfg(target_os)]` sources that only
    # compile on the other desktop, and `cargo metadata --locked` fails fast
    # on a Cargo.toml/Cargo.lock drift that would otherwise only surface
    # inside the macOS/Windows native builds below.
    # NOTE: full `cargo check/clippy --target <foreign desktop>` was tried
    # here and deliberately dropped: third-party C build scripts (aws-lc-sys
    # for Windows, objc2 helpers for macOS) need that desktop's C toolchain,
    # which no ubuntu runner has. Foreign-target compilation stays covered
    # by the per-OS `native` matrix (every PR compiles both desktops), and
    # foreign-target *logic* is covered without compiling by the
    # host-parameterized unit tests (config/shell/commands) plus
    # `check:platform-parity` in the `packaging` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-rust-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

  native:
    # Per-OS compile + execution (`cargo clippy`, `cargo test`), so each
    # desktop's `#[cfg(target_os)]` sources build on every PR. PRs also build
    # debug installers to validate packaging without release credentials.
    # Format and lockfile checks live in `rust-static`.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # CI never debugs these binaries. Full debug info made the Windows
      # dependency cache 1.77 GB and took five minutes just to save.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    concurrency:
      group: ci-native-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # The Windows x86_64 build compiles the on-device speech runtime with its
      # Vulkan backend, which needs the SDK's glslc + headers at build time.
      # Uses the official LunarG installer in silent mode (the installer sets
      # no env for this process, so VULKAN_SDK is exported for CMake and the
      # build script's link search).
      - name: Install Vulkan SDK (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.357.0"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          curl.exe -sSL -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = "C:\VulkanSDK\$version"
          $header = "$sdk\Include\vulkan\vulkan.h"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $header); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $header)) { throw "Vulkan SDK install did not produce $header" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Vulkan SDK ready at $sdk"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # PRs must exercise the actual bundlers without release credentials or
      # publishing. Debug packages keep this check cheaper than release builds.
      - if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build macOS installer for review
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: bash scripts/build-macos.sh build --debug --bundles app,dmg
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - name: Verify macOS installer for review
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh src-tauri/target/debug/bundle
      - name: Upload macOS installer for testing
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-macos-review-installer
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/target/debug/bundle/dmg/*.dmg
      - name: Build Windows installer for review
        if: github.event_name == 'pull_request' && runner.os == 'Windows'
        run: bun tauri build --debug --bundles nsis

  # Automated code review / security gates. Each gate runs independently and
  # starts immediately (no `needs` on the CI jobs above) so one slow suite
  # never hides the signal from the others. The `security-gate` aggregator
  # must pass before beta artifacts are published.
  # NOTE: CodeQL only scans javascript-typescript (it has no Rust support);
  # Rust review is clippy -D warnings (per-OS in `native`) plus cargo-audit
  # in the `audit` job, enforced for both desktop targets.
  e2e:
    name: UI tests (Playwright)
    # Ubuntu + Chromium only (cheap). Both platform branches are still
    # covered: the browser harness derives its platform from
    # navigator.userAgent, and the suite spoofs Windows and macOS agents
    # (see windows-branches.pw.ts, overhaul.pw.ts, summaries.pw.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        # Local binary (locked via bun.lock), not bunx, so the install
        # always uses exactly the pinned @playwright/test release.
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run UI tests
        run: bun run test:ui
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  codeql:
    name: Code review (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-codeql-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  audit:
    name: Dependency audit (bun + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies (bun)
        run: bun audit
      # Prebuilt cargo-audit binary (~10s). Replaces rustsec/audit-check,
      # which compiled cargo-audit from source (~3min), runs on deprecated
      # Node 20, and needs `checks: write` to post its Check Run (that
      # missing permission failed main as "Resource not accessible by
      # integration"). Plain `cargo audit` fails on vulnerabilities but
      # exits 0 on informational warnings (6x unmaintained unic/
      # proc-macro-error, 1x unsound glib RUSTSEC-2024-0429, transitive via
      # Tauri's Linux tray stack -> gtk 0.18, unfixable short of a GTK 0.20
      # / Tauri upgrade; tracked separately).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock

  dep-review:
    name: Review PR dependency changes
    # Deliberately almost no job-level `if`: this job must complete on
    # every workflow event. When it skipped off-PR, downstream
    # `needs.security-gate.outputs.*` comparisons evaluated false at
    # schedule time even after the gate succeeded with correct outputs
    # (verified empirically), starving the beta jobs. The action itself
    # stays PR-only via the step guard; off-PR the job is checkout + no-op.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-dep-review-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Aggregator: the sole branch-protection check must cover every required
  # build and test job, as well as the security jobs. A green review must
  # never allow a PR with failing frontend or native checks to merge.
  security-gate:
    name: Code review / security gate
    needs: [frontend, frontend-windows, rust-static, native, codeql, audit, e2e, dep-review, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - name: Verify all gates passed
        run: |
          fail=0
          for gate in "frontend:${{ needs.frontend.result }}" "frontend-windows:${{ needs.frontend-windows.result }}" "rust-static:${{ needs.rust-static.result }}" "native:${{ needs.native.result }}" "codeql:${{ needs.codeql.result }}" "audit:${{ needs.audit.result }}" "e2e:${{ needs.e2e.result }}" "packaging:${{ needs.packaging.result }}"; do
            echo "$gate"
            result="${gate##*:}"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          echo "dep-review:${{ needs.dep-review.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.dep-review.result }}" != "success" ]; then
              fail=1
            fi
          elif [ "${{ needs.dep-review.result }}" != "success" ] && [ "${{ needs.dep-review.result }}" != "skipped" ]; then
            fail=1
          fi
          exit $fail
      # Beta eligibility is recorded here for the publisher. Builders run on
      # manual dispatch (any branch) and main pushes, but never on PRs.
      - id: decide
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "beta_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Beta delivery. The two desktop builds run alongside the checks on main
  # and hand off via short-lived, run-scoped artifacts. Publication waits for
  # the full security-gate, which also covers frontend and native checks.
  # A failed check can waste build minutes, but cannot publish a red SHA.
  macos-beta:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Beta-only fast release tuning. Keeps output in target/release/ (what
      # the Tauri bundler expects) while skipping the fat-LTO single-codegen
      # link from Cargo.toml [profile.release] (stable keeps that).
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
      # Keep Finder's background/icon layout; Tauri otherwise skips it in CI.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # No typecheck/test rerun: the `frontend` and `native` gates check this
      # same SHA in parallel, and publication requires their success.
      # Free ad-hoc signing is the fallback. If Developer ID credentials
      # exist, use the same identity/notarization as stable releases so beta
      # updates do not unnecessarily invalidate macOS permission grants.
      - run: bun run prepare:release
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      - name: Build macOS installer (beta)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: bash scripts/build-macos.sh
          args: --target aarch64-apple-darwin --config src-tauri/target/release-tauri.conf.json
      # `tauri build` signs the updater archive for the plain package version
      # (0.1.0), but the rolling manifest announces `0.1.0+<sha>`. Since the
      # CLI records the version in the signature's trusted comment and the
      # updater plugin enforces signed == announced, the plain signature
      # always fails beta installs (SignedVersionMismatch). Re-sign for the
      # exact manifest version; the .app bundle version itself stays plain so
      # CFBundleShortVersionString remains numeric.
      - name: Re-sign macOS updater archive for the beta version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          sha="${KIVO_BUILD_SHA:?KIVO_BUILD_SHA is required}"
          beta_version="$version+$sha"
          mac_archive="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -n 1)"
          test -n "$mac_archive" || { echo "macOS updater archive not found for re-sign"; exit 1; }
          bun tauri signer sign --app-version "$beta_version" "$mac_archive"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify macOS installer before upload
        run: bash scripts/verify-macos-bundle.sh src-tauri/target/aarch64-apple-darwin/release/bundle
      - name: Upload bundle for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-macos
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          # NOTE: explicit `--target` redirects cargo output to
          # target/<triple>/release, not target/release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows-beta:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same beta-only fast release tuning as macos-beta above. NSIS is the
      # only Windows route: a single bundle build, no second packaging pass.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      # Stamped into the binary via option_env!("KIVO_BUILD_SHA") so the
      # in-app updater can tell same-version betas apart by commit.
      KIVO_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Vulkan SDK (Windows x64)
        shell: pwsh
        run: |
          $version = "1.4.357.0"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          curl.exe -sSL -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = "C:\VulkanSDK\$version"
          $header = "$sdk\Include\vulkan\vulkan.h"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $header); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $header)) { throw "Vulkan SDK install did not produce $header" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Vulkan SDK ready at $sdk"
      - run: bun install --frozen-lockfile --ignore-scripts
      # The updater archive is signed with Tauri's key; the manual .exe
      # remains unsigned and may display a SmartScreen warning.
      - run: bun run prepare:release
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      - name: Build unsigned NSIS installer (beta, untrusted)
        run: bun tauri build --bundles nsis --config src-tauri/target/release-tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Same signed-version binding as macos-beta above: `tauri build` signs
      # for the plain package version, but continuous.json announces
      # `version+sha`. Re-sign the NSIS updater bundle for the exact manifest
      # version so the updater plugin accepts it.
      - name: Re-sign Windows updater archive for the beta version
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $env:KIVO_BUILD_SHA) { throw 'KIVO_BUILD_SHA is required.' }
          $betaVersion = "$version+$env:KIVO_BUILD_SHA"
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows updater archive not found for re-sign.' }
          bun tauri signer sign --app-version $betaVersion $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater re-sign failed.' }
      - name: Upload installer for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kivo-beta-windows
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          # Tauri v2 (`createUpdaterArtifacts: true`) re-uses the NSIS
          # installer itself as the update bundle and signs it in place, so
          # the artifacts are `-setup.exe` + `-setup.exe.sig`. The legacy
          # `-setup.nsis.zip` pair is only produced by `v1Compatible`.
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  publish-continuous:
    name: Publish the continuous pre-release
    # Owns every mutation of the `continuous` release (asset uploads and
    # notes) so overlapping main pushes serialize here
    # while the builders above overlap. Asset names match what the old
    # tauri-action/gh flow shipped (dmg + app tarball + setup exe).
    needs: [macos-beta, windows-beta, security-gate]
    if: needs.macos-beta.result == 'success' && needs.windows-beta.result == 'success' && needs.security-gate.result == 'success' && needs.security-gate.outputs.beta_ready == 'true'
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kivo-beta-macos
          path: beta/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kivo-beta-windows
          path: beta/windows
      - name: Publish assets to the continuous pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # upload-artifact preserves the matched parents (dmg/…, macos/…),
          # so locate by name instead of assuming a flat layout.
          dmg="$(find beta/macos -maxdepth 3 -name '*.dmg' | head -n 1)"
          mac_archive="$(find beta/macos -name '*.app.tar.gz' | head -n 1)"
          # Tauri v2 signs the NSIS installer in place and re-uses it as the
          # Windows update bundle, so the installer is the archive.
          win_installer="$(find beta/windows -name '*-setup.exe' | head -n 1)"
          test -n "$dmg" || { echo "macOS dmg not found in artifact"; exit 1; }
          test -n "$mac_archive" || { echo "macOS updater archive not found in artifact"; exit 1; }
          test -f "$mac_archive.sig" || { echo "macOS updater signature not found in artifact"; exit 1; }
          test -n "$win_installer" || { echo "Windows installer not found in artifact"; exit 1; }
          test -f "$win_installer.sig" || { echo "Windows updater signature not found in artifact"; exit 1; }
          # Publishers serialize, but they may arrive out of commit order.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
            if [ "$latest_sha" != "$GITHUB_SHA" ]; then
              echo "Skipping stale beta $GITHUB_SHA; main is $latest_sha."
              exit 0
            fi
          fi
          KIVO_VERSION="$version" bun scripts/build-continuous-manifest.ts "$mac_archive" "$win_installer"
          notes_file="${RUNNER_TEMP}/kivo-beta-notes.md"
          cp packaging/beta-release-notes.md "$notes_file"
          printf '\nBuild: `%s` · Version: `%s` · Built: %s\n' "$GITHUB_SHA" "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$notes_file"
          # Keep the old release available if an upload fails. Publish the
          # manifest last, after its corresponding assets have arrived.
          if ! gh release view continuous > /dev/null 2>&1; then
            gh release create continuous \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Kivo — latest beta" \
              --notes-file "$notes_file"
          fi
          gh release upload continuous "$dmg" "$mac_archive" "$mac_archive.sig" "$win_installer" "$win_installer.sig" --clobber
          gh release upload continuous beta/continuous.json --clobber
          gh release edit continuous \
            --prerelease \
            --title "Kivo — latest beta" \
            --notes-file "$notes_file"
          # Keep the tag behind the release page's Source code links aligned
          # with the binary SHA after every asset has been published.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous" \
            -X PATCH -f sha="$GITHUB_SHA" -F force=true > /dev/null
