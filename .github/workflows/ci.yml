name: CI & Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Non-PR runs verify everything; docs/site-only changes skip Rust.
          if [ "$CHANGE_EVENT" != pull_request ]; then
            printf 'app=true\nbackend=true\n' >> "$GITHUB_OUTPUT"
          else
            files="$(git diff --name-only "$CHANGE_BASE...$CHANGE_HEAD" -- || true)"
            echo "$files"
            app=false; backend=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in docs/*|README.md|website/*|.editorconfig|.gitattributes) continue;;
              esac
              case "$f" in native-app/*) app=true;; src-tauri/*) backend=true;; .github/*) app=true; backend=true;; *) app=true; backend=true;; esac
            done <<< "$files"
            printf 'app=%s\nbackend=%s\n' "$app" "$backend" >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: changes
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: true
    with:
      app: ${{ needs.changes.outputs.app == 'true' }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}
  dep-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
  security-gate:
    # Preserve this external name: it is required by branch protection.
    name: Code review / security gate
    needs: [changes, verify, dep-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beta_ready: ${{ steps.decide.outputs.beta_ready }}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          DEP_REVIEW: ${{ needs.dep-review.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHANGES" = success
          test "$VERIFY" = success
          if [ "$EVENT" = pull_request ]; then test "$DEP_REVIEW" = success; else test "$DEP_REVIEW" = skipped; fi
      - id: decide
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo 'beta_ready=true' >> "$GITHUB_OUTPUT"
  windows-beta:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: continuous-build
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Beta and stable use the same optimized profile and dependency cache.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native-app
          shared-key: release
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      # Unsigned native binary; may display a SmartScreen warning.
      - name: Build native binary (beta, untrusted)
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release --manifest-path native-app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Beta build failed.' }
          $timer.Stop()
          "Beta build: $($timer.Elapsed.TotalSeconds.ToString('F1')) seconds" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem 'native-app/target/release/kivo-native.exe' | ForEach-Object { "Binary: $($_.Length) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
      - name: Native cache footprint
        if: always()
        shell: bash
        run: du -sh native-app/target >> "$GITHUB_STEP_SUMMARY"
      - name: Upload binary for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: kivo-beta-windows
          # Consumed minutes later by `publish-continuous`; not for humans.
          retention-days: 1
          path: native-app/target/release/kivo-native.exe

  publish-continuous:
    name: Publish the continuous pre-release
    # Owns every mutation of the `continuous` release (asset uploads and
    # notes) so overlapping main pushes serialize here
    # while superseded builders cancel.
    needs: [windows-beta, security-gate]
    if: github.ref == 'refs/heads/main' && needs.windows-beta.result == 'success' && needs.security-gate.result == 'success' && needs.security-gate.outputs.beta_ready == 'true'
    concurrency:
      group: continuous-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kivo-beta-windows
          path: beta/windows
      - name: Promote current main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find beta/windows -name 'kivo-native.exe' -print -quit)"
          test -n "$exe"
          version="$(grep '^version' native-app/Cargo.toml | head -1 | cut -d'"' -f2)"
          gh release delete continuous --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create continuous "$exe" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned native beta from main ${GITHUB_SHA} (native-app ${version}). Windows: download kivo-native.exe and run it (SmartScreen: More info -> Run anyway)."
