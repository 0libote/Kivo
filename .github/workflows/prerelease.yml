name: Pre-release (continuous)

# Rolling beta pre-release rebuilt from every commit to main.
#
# Unsigned / untrusted by design: no Apple, updater, or Windows signing keys
# are required. macOS builds ship unsigned (Gatekeeper will warn on first
# launch) and the MSIX is packed without a certificate (Windows requires
# sideloading / developer mode to install it). The tag-based `Release`
# workflow remains the signed path for stable `app-v*` releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuous-prerelease
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun typecheck
      - run: bun test
      - name: Reset the continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta pre-release rebuilt from every commit to main."
      # No APPLE_* / TAURI_SIGNING_* secrets: builds unsigned. No
      # prepare:release step: without TAURI_UPDATER_PUBKEY there are no
      # signed updater artifacts, so this ships a plain beta .dmg.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: continuous
          releaseName: Kivo continuous (beta)
          releaseBody: Rolling unsigned beta pre-release rebuilt from every commit to main. Prefer stable app-v* releases when available.
          releaseDraft: false
          prerelease: true
          args: --target aarch64-apple-darwin
      - name: Stamp release notes with the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit continuous \
            --prerelease \
            --title "Kivo continuous (beta)" \
            --notes "Rolling unsigned beta from main ${GITHUB_SHA}. Built $(date -u +%Y-%m-%dT%H:%M:%SZ). Unsigned: on macOS right-click the app and choose Open on first launch. Prefer stable app-v* releases when available."

  windows-msix:
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # No WINDOWS_CERTIFICATE_* secrets: pack an unsigned MSIX for beta.
      # Installing it requires sideloading / developer mode on Windows.
      - name: Build unsigned MSIX (beta, untrusted)
        shell: pwsh
        run: |
          .\packaging\windows\build-msix.ps1 -Publisher "CN=0libote"
      - name: Attach MSIX to the continuous pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload continuous "src-tauri\target\release\bundle\msix\Kivo_${version}_x64.msix" --clobber
