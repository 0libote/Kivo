name: Release
on:
  push:
    tags: ["app-v*", "[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      # The tag is the version of record: force every version file to it
      # before building so the binary reports the tag number.
      - name: Sync versions to tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#app-v}"
          test -n "$version"
          sed -i "s/^version = \".*\"/version = \"$version\"/" native-app/Cargo.toml src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" src-tauri/tauri.conf.json
          cargo metadata --no-deps --format-version 1 --manifest-path native-app/Cargo.toml > /dev/null
          cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path native-app/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native-app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Sign binary when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certificateFile = Join-Path $env:RUNNER_TEMP 'kivo-release.pfx'
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            try {
              $signTool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signTool) { throw 'SignTool was not found.' }
              & $signTool.FullName sign /f $certificateFile /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 native-app/target/release/kivo-native.exe
              if ($LASTEXITCODE -ne 0) { throw 'Binary signing failed.' }
            } finally { Remove-Item -LiteralPath $certificateFile -ErrorAction SilentlyContinue }
          }
      # Replace any existing release for this tag so re-pushed tags rebuild it.
      - name: Force draft release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$GITHUB_REF_NAME" --yes > /dev/null 2>&1 || true
          gh release create "$GITHUB_REF_NAME" native-app/target/release/kivo-native.exe \
            --draft \
            --title "Kivo $VERSION" \
            --notes "Kivo ${VERSION}. Windows 11 24H2+: download kivo-native.exe and run it (SmartScreen: More info -> Run anyway, unless signed)."
      # Main is protected (no direct pushes), so land the version bump
      # through an auto-merge PR. Never downgrades a newer main.
      - name: Push version bump to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version="${GITHUB_REF_NAME#app-v}"
          branch="release-bump-$GITHUB_REF_NAME"
          git reset --hard origin/main
          current="$(grep '^version' native-app/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$current" = "$version" ]; then
            echo "main already at $version; nothing to do."
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)"
          if [ "$newest" != "$version" ]; then
            echo "main ($current) is newer than tag ($version); not downgrading."
            exit 0
          fi
          git checkout -B "$branch" origin/main
          sed -i "s/^version = \".*\"/version = \"$version\"/" native-app/Cargo.toml src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" src-tauri/tauri.conf.json
          cargo metadata --no-deps --format-version 1 --manifest-path native-app/Cargo.toml > /dev/null
          cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          git add native-app/Cargo.toml native-app/Cargo.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Bump versions to $version for $GITHUB_REF_NAME"
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" --json number --jq .number > /dev/null 2>&1; then
            gh pr create --head "$branch" --base main \
              --title "Bump versions to $version for $GITHUB_REF_NAME" \
              --body "Automated version bump from the $GITHUB_REF_NAME release run."
          fi
          gh pr merge "$branch" --auto --merge
