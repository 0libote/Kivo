name: Release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

# Tags do not trigger the CI workflow (it listens on pull_request / main),
# so stable releases use the complete shared verification gate instead of shipping
# whatever a tag points at unchecked.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      app: true
      backend: true

  windows:
    needs: [verify]
    # Stable releases must originate from version tags or main. Without this,
    # a manual dispatch from any branch could cut a stable release, and the
    # tag-version check below is skipped for non-tag refs.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    concurrency:
      group: stable-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native-app
          shared-key: release
      - name: Validate tag version
        shell: bash
        run: |
          version="$(grep '^version' native-app/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "app-v$version"; fi
      - name: Build unsigned native binary
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native-app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Sign binary when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certificateFile = Join-Path $env:RUNNER_TEMP 'kivo-release.pfx'
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            try {
              $signTool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signTool) { throw 'SignTool was not found.' }
              & $signTool.FullName sign /f $certificateFile /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 native-app/target/release/kivo-native.exe
              if ($LASTEXITCODE -ne 0) { throw 'Binary signing failed.' }
            } finally { Remove-Item -LiteralPath $certificateFile -ErrorAction SilentlyContinue }
          }
      - name: Draft stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version' native-app/Cargo.toml | head -1 | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME:-app-v$version}"
          gh release create "$tag" native-app/target/release/kivo-native.exe \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Kivo $version" \
            --notes "Kivo ${version}. Windows 11 24H2+: download kivo-native.exe and run it (SmartScreen: More info -> Run anyway, unless signed)."
