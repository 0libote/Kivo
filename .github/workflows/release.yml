name: Release
on:
  push:
    tags: ["app-v*", "[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-app
          key: release
      - name: Sync versions to tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(python scripts/sync_version.py "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native-app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Sign binary when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certificateFile = Join-Path $env:RUNNER_TEMP 'kivo-release.pfx'
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            try {
              $signTool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signTool) { throw 'SignTool was not found.' }
              & $signTool.FullName sign /f $certificateFile /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 native-app/target/release/kivo-native.exe
              if ($LASTEXITCODE -ne 0) { throw 'Binary signing failed.' }
            } finally { Remove-Item -LiteralPath $certificateFile -ErrorAction SilentlyContinue }
          }
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != true ]; then
              echo "Release is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Kivo $VERSION" \
              --notes "Kivo ${VERSION} native preview. Windows 11 24H2+: download kivo-native.exe. macOS Apple Silicon: download kivo-native-macos-arm64, or run brew install https://raw.githubusercontent.com/0libote/Kivo/main/Formula/kivo.rb (no Gatekeeper prompts). Dictation and system selection integration are still being ported."
          fi
          gh release upload "$GITHUB_REF_NAME" native-app/target/release/kivo-native.exe --clobber

  build-macos:
    needs: build
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-app
          key: release-macos
      - name: Sync versions to tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/sync_version.py "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --manifest-path native-app/Cargo.toml
      - name: Stage macOS asset
        shell: bash
        run: |
          set -euo pipefail
          cp native-app/target/release/kivo-native "$RUNNER_TEMP/kivo-native-macos-arm64"
          chmod +x "$RUNNER_TEMP/kivo-native-macos-arm64"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != true ]; then
              echo "Release is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Kivo $VERSION" \
              --notes "Kivo ${VERSION} native preview. Windows 11 24H2+: download kivo-native.exe. macOS Apple Silicon: download kivo-native-macos-arm64, or run brew install https://raw.githubusercontent.com/0libote/Kivo/main/Formula/kivo.rb (no Gatekeeper prompts). Dictation and system selection integration are still being ported."
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/kivo-native-macos-arm64" --clobber

  bump-version:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/sync_version.py "$GITHUB_REF_NAME" --only-newer)"
          git add native-app/Cargo.toml native-app/Cargo.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "main is already at this version or newer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="release-bump-$GITHUB_REF_NAME"
          git switch -c "$branch"
          git commit -m "Bump versions to $version for $GITHUB_REF_NAME"
          expected="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          git push "--force-with-lease=refs/heads/$branch:$expected" origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head "$branch" --base main \
              --title "Bump versions to $version for $GITHUB_REF_NAME" \
              --body "Automated version bump from the $GITHUB_REF_NAME release run."
          fi
          # GITHUB_TOKEN pushes do not trigger CI; explicit dispatch does.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --merge
