name: Release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

# Tags do not trigger the CI workflow (it listens on pull_request / main),
# so stable releases carry their own audit gate instead of shipping
# whatever a tag points at unchecked.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (bun + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies (bun)
        run: bun audit
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock

  macos:
    needs: [audit]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run prepare:release
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: app-v__VERSION__
          releaseName: Kivo __VERSION__
          releaseBody: See the attached installers and update manifest.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --config src-tauri/target/release-tauri.conf.json

  windows:
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # The Windows x86_64 build compiles the on-device speech runtime with its
      # Vulkan backend, which needs the SDK's glslc + headers at build time.
      # Uses the official LunarG installer in silent mode (the installer sets
      # no env for this process, so VULKAN_SDK is exported for CMake and the
      # build script's link search).
      - name: Install Vulkan SDK (Windows x64)
        shell: pwsh
        run: |
          $version = "1.4.357.0"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          curl.exe -sSL -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = "C:\VulkanSDK\$version"
          $header = "$sdk\Include\vulkan\vulkan.h"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $header); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $header)) { throw "Vulkan SDK install did not produce $header" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Vulkan SDK ready at $sdk"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run check:packaging
      - run: bun run check:platform-parity
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # NSIS needs no paid certificate or store account. The Tauri updater
      # artifacts (.nsis.zip + .sig, merged into latest.json by tauri-action)
      # are signed with the same TAURI_SIGNING_* key as macOS, so Windows
      # offers the same in-app Download and Install path. If an Authenticode
      # certificate is available, sign the final .exe installer afterwards
      # and re-upload it: Authenticode only touches the manual .exe, never
      # the updater .nsis.zip signature.
      - run: bun run prepare:release
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Kivo __VERSION__
          releaseBody: See the attached installers and update manifest.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis --config src-tauri/target/release-tauri.conf.json
      - name: Sign installer when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certificateFile = Join-Path $env:RUNNER_TEMP 'kivo-release.pfx'
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            try {
              $signTool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signTool) { throw 'SignTool was not found.' }
              Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | ForEach-Object {
                & $signTool.FullName sign /f $certificateFile /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
                if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed.' }
              }
            } finally { Remove-Item -LiteralPath $certificateFile -ErrorAction SilentlyContinue }
          }
      - name: Re-upload signed .exe when a certificate is configured
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "app-v$version" }
            gh release upload $tag "src-tauri/target/release/bundle/nsis/Kivo_${version}_x64-setup.exe" --clobber
          }
