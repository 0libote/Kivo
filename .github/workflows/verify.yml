name: Verify
on:
  workflow_call:
    inputs:
      app:
        description: native-app/ changed
        type: boolean
        default: true
      backend:
        description: src-tauri/ changed
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-pinned workflow tools
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p workflow-tools
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz -C workflow-tools
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz' | sha256sum --check
          tar -xJf shellcheck.tar.xz -C workflow-tools --strip-components=1
          echo "$RUNNER_TEMP/workflow-tools" >> "$GITHUB_PATH"
      - run: actionlint
  rust-static:
    if: inputs.app || inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - run: cargo fmt --manifest-path native-app/Cargo.toml --all -- --check
      - run: cargo metadata --locked --manifest-path native-app/Cargo.toml --format-version 1 > /dev/null
  backend:
    name: Backend checks (src-tauri)
    if: inputs.backend
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-native
        with:
          profile: checks
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native cache footprint
        if: always()
        shell: bash
        run: du -sh src-tauri/target >> "$GITHUB_STEP_SUMMARY"
  app:
    name: Native app checks (egui, no webview)
    if: inputs.app
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: native-app
          shared-key: checks
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo clippy --locked --manifest-path native-app/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native-app/Cargo.toml
      - name: Native cache footprint
        if: always()
        shell: bash
        run: du -sh native-app/target >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit (cargo)
    if: inputs.app || inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Prebuilt cargo-audit binary (~10s). Plain `cargo audit` fails on
      # vulnerabilities but exits 0 on informational warnings.
      # Scoped ignores below: zip 4.6.1 (via tauri-plugin-updater 2.x, which
      # pins zip ^4 with no patched 4.x upstream) has 3 unpatched
      # vulnerabilities incl. a 9.1 symlink-escape on extract
      # (RUSTSEC-2026-0367/0368/0369). Re-check on the Tauri/updater release
      # that moves to zip 9; drop these flags then.
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (cargo-audit)
        run: |
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369
          cargo audit --file native-app/Cargo.lock

  verified:
    if: always()
    needs: [workflows, rust-static, backend, app, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          APP: ${{ inputs.app }}
          BACKEND: ${{ inputs.backend }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          required = {'workflows': 'true', 'rust-static': 'true', 'backend': os.environ['BACKEND'], 'app': os.environ['APP'], 'audit': 'true'}
          required['rust-static'] = 'true' if (os.environ['APP'] == 'true' or os.environ['BACKEND'] == 'true') else 'false'
          required['audit'] = required['rust-static']
          for job, enabled in required.items():
              expected = 'success' if enabled == 'true' else 'skipped'
              result = needs[job]['result']
              print(f'{job}: {result} (expected {expected})')
              if result != expected: raise SystemExit(1)
          PY
