<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440"><rect width="660" height="440" fill="#f7f7f8"/><text x="330" y="67" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="600" fill="#1d1d1f">Kivo</text><text x="330" y="98" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#626267">A little less typing. A little more flow.</text><text x="330" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f">Drag Kivo to Applications</text><rect x="98" y="158" width="164" height="166" rx="24" fill="#f0f0f1"/><rect x="398" y="158" width="164" height="166" rx="24" fill="#f0f0f1"/><path d="M292 232 H368 M358 222 L368 232 L358 242" fill="none" stroke="#626267" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 339 H588" stroke="#f0f0f1" stroke-width="2"/><text x="330" y="373" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#1d1d1f">Then open Kivo from Applications.</text><text x="330" y="399" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#626267">You can eject this disk after copying. Kivo lives in your menu bar.</text></svg>
