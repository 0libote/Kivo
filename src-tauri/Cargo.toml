[package]
name = "kivo"
version = "0.1.0"
description = "A quiet, system-wide writing and dictation utility"
authors = ["0libote"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "kivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
# On-device speech capture. cpal records the default input device into memory;
# rubato resamples it to the 16 kHz mono f32 the local models expect.
cpal = "0.16"
rubato = "0.16"

# On-device transcription runtime (whisper-family GGML/GGUF). The default
# backend is enabled per target below: Metal on macOS, static CPU elsewhere.
# Windows x86_64 could opt into `vulkan` + `dynamic-backends`, but that needs
# the Vulkan SDK at build time and shipping the ggml DLLs; CPU keeps the
# installer self-contained. Add `features = ["vulkan"]` there when GPU
# transcription is worth the packaging cost.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.2.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
# Stable signed builds (release.yml, tags): smallest binary, slowest compile.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Beta / continuous builds (ci.yml macos-beta/windows-beta) intentionally override this profile
# via CARGO_PROFILE_RELEASE_* env vars (thin LTO, 16 codegen units, no strip)
# so the output stays in target/release/ (Tauri bundler + upload paths assume
# that) while skipping the ~2min fat-LTO link. Do not add a separate
# [profile.beta] without also updating the Tauri bundle / upload paths.
